spring.application.name=MediGO

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.deserialization.fail-on-unknown-properties=true
jwt.secret=${JWT_SECRET}
jwt.expiration-access=${JWT_EXPIRATION_ACCESS}
jwt.expiration-refresh=${JWT_EXPIRATION_REFRESH}

# GMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_SMPT_USERNAME}
spring.mail.password=${MAIL_SMPT_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# MediGO
app.name=MediGO
app.frontend-url=http://localhost:3000

# Stripe Configuration
stripe.api.secret-key=${STRIPE_API_SECRET_KEY}
stripe.platform.commission=0.05
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# VIDEO
daily.api.key=${DAILY_API_KEY}
daily.domain=${DAILY_DOMAIN}
daily.api.url=https://api.daily.co/v1